# Render Blueprint: the clickable prototype (FICTIONAL data only) as a static site.
# No server, database or secrets: everything is built into apps/web/out.
services:
  - type: web
    name: oromia-sports-demo
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: >-
      corepack enable &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter "@oromia/web..." --filter "!@oromia/web" build &&
      pnpm --filter @oromia/web build:demo
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /
        destination: /index.html
