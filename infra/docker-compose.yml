# Local development only. Credentials below are throwaway dev defaults — never reuse them elsewhere.
name: oromia-sports
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: oromia
      POSTGRES_PASSWORD: oromia
      POSTGRES_DB: oromia_sports
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oromia -d oromia_sports"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oromia-dev
      MINIO_ROOT_PASSWORD: oromia-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-buckets:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 oromia-dev oromia-dev-secret &&
      mc mb --ignore-existing local/documents local/imports local/public &&
      mc mb --ignore-existing --with-lock local/evidence &&
      mc version enable local/documents"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
